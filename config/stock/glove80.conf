# Lighting is opt-in; there is no startup animation.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Fade the selected colors to black without changing the user's color map.
CONFIG_ZMK_RGB_UNDERGLOW_FADE_OFF=y
CONFIG_ZMK_RGB_UNDERGLOW_FADE_OFF_MS=1500
# USB suspend is not the same as display sleep; opt in only when desired.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB_SUSPEND=n
